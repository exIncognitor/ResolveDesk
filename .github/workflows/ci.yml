name: ResolveDesk checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      RESOLVEDESK_PAID_API_ENABLED: 'false'
      RESOLVEDESK_OWN_KEY_CONFIRMED: 'false'
      INTENT_EMBEDDING_PROVIDER: local
      MCP_EXTERNAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt -r requirements-audit.txt
      - run: python -m pip check
      - run: python -X utf8 -B tools/check_dependencies.py
      - run: python -X utf8 -B tools/check_release.py
      - run: python -X utf8 -B -m pytest -q

  frontend:
    name: Vue tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  services:
    name: PostgreSQL Redis Chroma integration
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      RESOLVEDESK_PAID_API_ENABLED: 'false'
      RESOLVEDESK_OWN_KEY_CONFIRMED: 'false'
      RESOLVEDESK_SERVICE_TESTS: 'true'
      INTENT_EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 -B tools/setup_services.py
      - run: docker compose --env-file .codex-runtime/services.env -f compose.services.yaml up -d --wait
      - run: python -X utf8 -B tools/check_services.py
      - run: python -X utf8 -B -m pytest tests -q --tb=short
